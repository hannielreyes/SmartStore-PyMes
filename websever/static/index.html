<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galería SmartStore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
        }
        
        .header .badge {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 16px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafbfc;
            margin-bottom: 24px;
        }
        
        .upload-area:hover {
            border-color: #1a73e8;
            background: #f0f4ff;
        }
        
        .upload-area .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }
        
        .upload-area .title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        
        .upload-area .subtitle {
            font-size: 14px;
            color: #6b7280;
        }
        
        .upload-area input[type="file"] {
            display: none;
        }
        
        .upload-progress {
            display: none;
            margin-bottom: 20px;
        }
        
        .upload-progress .bar {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .upload-progress .bar .fill {
            height: 100%;
            width: 0%;
            background: #1a73e8;
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        .upload-progress .label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        
        .gallery-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 12px;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .gallery .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0;
            color: #9ca3af;
            font-size: 14px;
        }
        
        .gallery .image-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background: #f3f4f6;
        }
        
        .gallery .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .gallery .image-item .delete-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .gallery .image-item .delete-btn:hover {
            background: rgba(220, 38, 38, 0.9);
        }
        
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .footer .count {
            font-size: 13px;
            color: #6b7280;
        }
        
        .footer .clear-btn {
            background: none;
            border: none;
            color: #dc2626;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .footer .clear-btn:hover {
            background: #fee2e2;
        }
        
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .toast.success {
            background: #059669;
        }
        
        .toast.error {
            background: #dc2626;
        }
        
        @media (max-width: 420px) {
            .container {
                padding: 16px;
            }
            .gallery {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Galería</h1>
            <span class="badge">SmartStore</span>
        </div>
        
        <div class="upload-area" id="uploadArea">
            <span class="icon">📤</span>
            <div class="title">Subir imagen</div>
            <div class="subtitle">Toca para seleccionar o tomar foto</div>
            <input type="file" id="fileInput" accept="image/*" capture="environment">
        </div>
        
        <div class="upload-progress" id="uploadProgress">
            <div class="bar"><div class="fill" id="progressFill"></div></div>
            <div class="label">
                <span id="progressText">Subiendo...</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>
        
        <div class="gallery-title" id="galleryTitle">📷 Imágenes disponibles</div>
        <div class="gallery" id="gallery">
            <div class="empty">No hay imágenes aún</div>
        </div>
        
        <div class="footer">
            <span class="count" id="imageCount">0 imágenes</span>
            <button class="clear-btn" id="clearBtn">🗑️ Limpiar</button>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <script>
        // ==========================================
        // CONFIGURACIÓN
        // ==========================================
        const API_BASE = window.location.origin;
        
        // ==========================================
        // ELEMENTOS DEL DOM
        // ==========================================
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const gallery = document.getElementById('gallery');
        const toast = document.getElementById('toast');
        const imageCount = document.getElementById('imageCount');
        const clearBtn = document.getElementById('clearBtn');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        
        // ==========================================
        // FUNCIONES
        // ==========================================
        
        function showToast(message, type = 'info') {
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }
        
        async function loadGallery() {
            try {
                const response = await fetch(API_BASE + '/images');
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Error al cargar imágenes');
                }
                
                renderGallery(data.images);
                updateCount(data.images.length);
                
            } catch (error) {
                console.error('Error:', error);
                showToast('Error al cargar las imágenes', 'error');
            }
        }
        
        function renderGallery(images) {
            gallery.innerHTML = '';
            
            if (images.length === 0) {
                gallery.innerHTML = '<div class="empty">📭 No hay imágenes aún</div>';
                return;
            }
            
            images.forEach(img => {
                const item = document.createElement('div');
                item.className = 'image-item';
                item.innerHTML = `
                    <img src="${img.url}" alt="${img.filename}" loading="lazy">
                    <button class="delete-btn" data-filename="${img.filename}" title="Eliminar">✕</button>
                `;
                
                const deleteBtn = item.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteImage(img.filename);
                });
                
                gallery.appendChild(item);
            });
        }
        
        function updateCount(count) {
            imageCount.textContent = count === 0 ? '0 imágenes' : count === 1 ? '1 imagen' : count + ' imágenes';
        }
        
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('image', file);
            
            uploadProgress.style.display = 'block';
            progressFill.style.width = '0%';
            progressText.textContent = 'Subiendo...';
            progressPercent.textContent = '0%';
            
            try {
                const xhr = new XMLHttpRequest();
                
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressFill.style.width = percent + '%';
                        progressPercent.textContent = percent + '%';
                    }
                });
                
                const response = await new Promise((resolve, reject) => {
                    xhr.open('POST', API_BASE + '/upload');
                    xhr.onload = () => resolve(xhr);
                    xhr.onerror = () => reject(new Error('Error de red'));
                    xhr.send(formData);
                });
                
                if (response.status === 200) {
                    const data = JSON.parse(response.responseText);
                    if (data.success) {
                        showToast('✅ Imagen subida correctamente', 'success');
                        loadGallery();
                    } else {
                        throw new Error(data.error || 'Error al subir');
                    }
                } else {
                    throw new Error('Error: ' + response.status);
                }
                
            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Error al subir: ' + error.message, 'error');
            } finally {
                uploadProgress.style.display = 'none';
                progressFill.style.width = '0%';
            }
        }
        
        async function deleteImage(filename) {
            if (!confirm('¿Eliminar esta imagen?')) return;
            
            try {
                const response = await fetch(API_BASE + '/delete/' + filename, { method: 'DELETE' });
                const data = await response.json();
                
                if (data.success) {
                    showToast('🗑️ Imagen eliminada', 'success');
                    loadGallery();
                } else {
                    throw new Error(data.error || 'Error al eliminar');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Error al eliminar', 'error');
            }
        }
        
        async function clearGallery() {
            if (!confirm('¿Eliminar TODAS las imágenes de la galería?')) return;
            
            try {
                const response = await fetch(API_BASE + '/clear', { method: 'DELETE' });
                const data = await response.json();
                
                if (data.success) {
                    showToast('🗑️ Galería limpiada', 'success');
                    loadGallery();
                } else {
                    throw new Error(data.error || 'Error al limpiar');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Error al limpiar', 'error');
            }
        }
        
        // ==========================================
        // EVENTOS
        // ==========================================
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFile(e.target.files[0]);
                fileInput.value = '';
            }
        });
        
        clearBtn.addEventListener('click', clearGallery);
        
        // ==========================================
        // INICIALIZAR
        // ==========================================
        loadGallery();
        
        // Recargar cada 30 segundos para actualizar automáticamente
        setInterval(loadGallery, 30000);
    </script>
</body>
</html>
